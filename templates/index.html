<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Video Interviewer</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
  <div id="warningMsg"></div>
  <h2 class="page-title">AI Video Interviewer</h2>

  <!-- Call container (main layout like WhatsApp call) -->
  <div class="call-container">
    <!-- Main video (interviewee) -->
    <div class="video-container main-video">
      <video id="preview" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <!-- AI Interviewer PiP -->
   <div class="video-container pip-video" id="draggable">
  <video id="aiVideo" autoplay muted playsinline loop>
    <source src="/static/ai_visual.mp4" type="video/mp4" />
  </video>
</div>


    <!-- Controls -->
    <div class="controls">
      <button id="startBtn">Start Interview</button>
      <button id="nextQuestionBtn" disabled>Next Question</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="downloadPdfBtn" disabled>Download PDF</button>
    </div>
  </div>

  <!-- Info bar -->
  <div class="info-bar">
    <div><strong>Session:</strong> <span id="sessionId">-</span></div>
    <div><strong>Current Question:</strong> <span id="question">-</span></div>
  </div>

  <!-- Panels -->
  <div class="panels">
    <div class="panel">
      <h3>Live Transcript & Scores</h3>
      <div id="transcripts"></div>
    </div>
    <div class="panel">
      <h3>Status Log</h3>
      <div id="statusLog" class="log"></div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
